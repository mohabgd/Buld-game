<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المصابيح - نسخة التليجرام</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-wrapper {
            text-align: center;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        /* التحكم بالصوت */
        .sound-btn {
            position: absolute;
            top: -45px;
            left: 5px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(30, 30, 30, 0.9);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .info-block { text-align: center; }
        .label { font-size: 0.7em; color: #888; display: block; }
        .value { color: #ffea00; font-weight: bold; font-size: 1.1em; }

        #game-board {
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            background: #111;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #222;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: 8px;
        }
        .row.current { background: rgba(255, 234, 0, 0.05); border: 1px solid rgba(255,234,0,0.1); }

        .multiplier { font-size: 0.8em; color: #ffc107; width: 45px; text-align: left; font-weight: bold; }

        .bulb-holder { position: relative; width: 45px; height: 60px; }
        .bulb {
            width: 100%; height: 100%;
            background-color: #333;
            border-radius: 50% 50% 20% 20%;
            cursor: pointer;
            border: 1px solid #000;
            transition: 0.2s;
        }
        .bulb.active { border: 2px solid #fff; }
        .bulb.on {
            background-color: #ffea00;
            box-shadow: 0 0 20px #ffea00;
            border-color: #fff;
        }
        .bulb.broken { background-color: #1a1a1a; border: 1px solid #f00; position: relative; }
        .bulb.broken::after { content: "✖"; color: red; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .controls { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; text-align: center; }
        
        .btn-group { display: flex; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; transition: 0.3s; }
        #start-btn { background: #ffea00; color: #000; }
        #cashout-btn { background: #28a745; color: #fff; display: none; }
        button:disabled { background: #444; color: #888; }

        #status { margin-top: 10px; font-size: 0.9em; color: #888; }

        @keyframes shake { 0% { transform: translate(2px,2px); } 100% { transform: translate(-2px,-2px); } }
        .screen-shake { animation: shake 0.1s infinite; }
    </style>
</head>
<body>

<div class="game-wrapper" id="main-wrapper">
    <div class="sound-btn" id="mute-toggle" onclick="toggleMute()">🔊</div>

    <div class="info-bar">
        <div class="info-block">
            <span class="label">الرصيد</span>
            <span id="balance" class="value">1000.00</span>
        </div>
        <div class="info-block">
            <span class="label">الربح الممكن</span>
            <span id="potential" class="value">0.00</span>
        </div>
    </div>

    <div id="game-board"></div>

    <div class="controls">
        <input type="number" id="bet-input" value="10" min="1">
        <div class="btn-group">
            <button id="start-btn" onclick="startGame()">ابدأ</button>
            <button id="cashout-btn" onclick="cashOut()">CASH OUT</button>
        </div>
    </div>
    <p id="status">أدخل الرهان وابدأ اللعب</p>
</div>

<script>
    // تهيئة تليجرام
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let balance = parseFloat(localStorage.getItem('userBalance')) || 1000;
    let currentBet = 0;
    let activeRow = 0;
    let isGameOver = true;
    let muted = false;

    // استبدل هذه الروابط بملفاتك المحلية إذا كنت قد رفعتها على GitHub
    const sounds = {
        click: new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3'),
        win: new Audio('https://www.soundjay.com/misc/sounds/magic-chime-01.mp3'),
        explode: new Audio('https://www.soundjay.com/human/sounds/glass-break-1.mp3')
    };

    const config = {
        0: { broken: 1, mult: 1.43 },
        1: { broken: 1, mult: 1.96 },
        2: { broken: 2, mult: 3.76 },
        3: { broken: 3, mult: 12.00 }
    };

    const balanceEl = document.getElementById('balance');
    const potentialEl = document.getElementById('potential');
    const statusEl = document.getElementById('status');

    balanceEl.innerText = balance.toFixed(2);

    function toggleMute() {
        muted = !muted;
        document.getElementById('mute-toggle').innerText = muted ? "🔇" : "🔊";
    }

    function play(name) {
        if (!muted) {
            sounds[name].currentTime = 0;
            sounds[name].play().catch(() => {});
        }
    }

    function haptic(type) {
        if (tg.HapticFeedback) {
            if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
            else tg.HapticFeedback.impactOccurred('light');
        }
    }

    function initBoard() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            row.id = `r-${i}`;
            
            const m = document.createElement('span');
            m.className = 'multiplier';
            m.innerText = `x${config[i].mult}`;
            row.appendChild(m);

            const broken = [];
            while(broken.length < config[i].broken) {
                let r = Math.floor(Math.random() * 4);
                if (!broken.includes(r)) broken.push(r);
            }

            for (let j = 0; j < 4; j++) {
                const bulb = document.createElement('div');
                bulb.className = 'bulb';
                bulb.onclick = () => check(i, j, broken, bulb);
                const h = document.createElement('div');
                h.className = 'bulb-holder';
                h.appendChild(bulb);
                row.appendChild(h);
            }
            board.appendChild(row);
        }
    }

    function startGame() {
        const amt = parseFloat(document.getElementById('bet-input').value);
        if (amt > balance || amt <= 0) return alert("الرصيد غير كافٍ");

        balance -= amt;
        currentBet = amt;
        updateBalance();
        
        isGameOver = false;
        activeRow = 0;
        document.getElementById('start-btn').disabled = true;
        document.getElementById('cashout-btn').style.display = 'none';
        statusEl.innerText = "اختر مصباحاً!";
        
        initBoard();
        highlightRow(0);
        play('click');
        haptic('light');
    }

    function check(rIdx, bIdx, broken, el) {
        if (isGameOver || rIdx !== activeRow) return;

        if (broken.includes(bIdx)) {
            el.classList.add('broken');
            play('explode');
            haptic('error');
            isGameOver = true;
            document.getElementById('main-wrapper').classList.add('screen-shake');
            setTimeout(() => {
                document.getElementById('main-wrapper').classList.remove('screen-shake');
                reset();
            }, 500);
        } else {
            el.classList.add('on');
            play('win');
            haptic('light');
            let win = currentBet * config[rIdx].mult;
            potentialEl.innerText = win.toFixed(2);
            activeRow++;
            document.getElementById('cashout-btn').style.display = 'block';
            
            if (activeRow === 4) cashOut();
            else highlightRow(activeRow);
        }
    }

    function highlightRow(idx) {
        document.querySelectorAll('.row').forEach(r => r.classList.remove('current'));
        document.getElementById(`r-${idx}`).classList.add('current');
        document.querySelectorAll(`#r-${idx} .bulb`).forEach(b => b.classList.add('active'));
    }

    function cashOut() {
        if (isGameOver) return;
        balance += parseFloat(potentialEl.innerText);
        updateBalance();
        play('win');
        reset();
    }

    function updateBalance() {
        balanceEl.innerText = balance.toFixed(2);
        localStorage.setItem('userBalance', balance);
    }

    function reset() {
        isGameOver = true;
        document.getElementById('start-btn').disabled = false;
        document.getElementById('cashout-btn').style.display = 'none';
        potentialEl.innerText = "0.00";
    }

    initBoard();
</script>
</body>
</html>
